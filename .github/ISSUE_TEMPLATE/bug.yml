name: Uma volta desnecessária
description: Relatar um problema no fluxo de abrir uma conversa.
title: "[Bug] "
body:
  - type: dropdown
    id: browser
    attributes:
      label: Qual navegador?
      options: [Chrome, Firefox, Outro]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versões do navegador e da extensão
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: O que aconteceu e o que você esperava?
      description: Informe se a aba foi preservada ou recarregou. Não inclua telefone real, mensagens, cookies, QR code ou dados de clientes.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Mensagem de erro, se apareceu
      description: Remova dados pessoais antes de enviar.
