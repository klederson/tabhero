name: An unnecessary detour
description: Report a problem opening a conversation.
title: "[Bug] "
body:
  - type: dropdown
    id: browser
    attributes:
      label: Which browser?
      options: [Chrome, Firefox, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Browser and extension versions
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
      description: Explain whether the document stayed loaded or reloaded. Do not include real phone numbers, messages, cookies, QR codes or customer data.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message, if any
      description: Remove personal information before submitting.
