name: Check extension packages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension-analytics
      - run: npm run test:disclosures
      - run: npm run test:browser
      - run: npm run test:quick-reply
