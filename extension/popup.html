<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TabHero — Quick reply</title><link rel="stylesheet" href="popup.css"><script type="module" src="popup.js"></script></head>
<body><header><a class="brand" href="https://klederson.github.io/tabhero/" target="_blank" rel="noopener noreferrer"><img src="icons/48.png" width="29" height="29" alt=""><strong>tabhero.</strong></a><div class="header-actions"><button id="support" class="icon support-icon" type="button" data-title="supportButton">♡</button><button id="refresh" class="icon" type="button" data-title="refresh">↻</button><button id="settings" class="icon" type="button" data-title="settings">✦</button></div></header>
<main><section id="main-panel"><p class="eyebrow" data-text="title">Quick reply</p><h1 data-text="subtitle">A little reply. Right here.</h1><div id="account-field" hidden><label for="account" data-text="account">WhatsApp account</label><select id="account"></select></div><div id="empty" hidden><p id="empty-copy"></p><button class="primary" id="open-whatsapp" type="button" data-text="openWhatsApp">Open WhatsApp</button></div>
<div id="composer" hidden><label id="recipient-label" for="recipient" data-text="replyTo">Reply to</label><div id="recipient-picker" class="recipient-picker"><button id="recipient" class="recipient-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="recipient-menu" aria-labelledby="recipient-label recipient-value"><span id="recipient-value"></span><span aria-hidden="true">⌄</span></button><div id="recipient-menu" role="dialog" aria-labelledby="recipient-label" hidden><input id="recipient-search" type="search" maxlength="100" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="recipient-options" data-placeholder="searchChats" data-title="searchChats"><ul id="recipient-options" role="listbox" aria-labelledby="recipient-label"></ul><p id="recipient-empty" role="status" hidden></p></div></div><aside class="received"><span data-text="received">They said</span><blockquote id="received"></blockquote></aside><div class="saved-heading"><label for="reply" data-text="typeReply">Your reply</label><button class="link" id="manage" type="button" data-text="saved">My saved replies</button></div><div id="saved-chips"></div><textarea id="reply" rows="4" maxlength="10000" data-placeholder="placeholder"></textarea><div class="actions"><button id="suggest" type="button" class="secondary">✦ <span data-text="suggest">Suggest a reply</span></button><button id="send" type="button" class="primary" data-text="send">Send reply</button></div><p class="note" data-text="aiNote"></p><button id="checked" class="secondary full" type="button" hidden data-text="checked">I checked WhatsApp</button></div><p class="footnote" data-text="kept"></p><button id="support-footer" class="support-entry" type="button"><span class="support-heart" aria-hidden="true">♡</span><span data-text="supportButton">Support TabHero</span><span aria-hidden="true">↗</span></button></section>
<section id="ai-panel" hidden><button class="link back" type="button" data-back>← <span data-text="back">Back</span></button><h1 data-text="aiSetup"></h1><p data-text="aiSteps"></p><a class="key-link" href="https://openrouter.ai/settings/keys" target="_blank" rel="noopener noreferrer" data-text="getKey"></a><form id="key-form"><label for="api-key" data-text="key"></label><input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="300"><button class="primary full" type="submit" data-text="saveKey"></button></form><p class="note" data-text="aiFree"></p><p class="note" data-text="aiNote"></p><button class="link" id="disconnect" type="button" hidden data-text="disconnect"></button><p class="note" data-text="localNote"></p></section>
<section id="saved-panel" hidden><button class="link back" type="button" data-back>← <span data-text="back">Back</span></button><h1 data-text="saved"></h1><div id="saved-list"></div><p id="no-saved" class="note" data-text="emptySaved"></p><button class="secondary full" id="new-reply" type="button" data-text="newReply"></button><form id="saved-form" hidden><label for="saved-title" data-text="titleField"></label><input id="saved-title" maxlength="60" required><label for="saved-text" data-text="textField"></label><textarea id="saved-text" rows="4" maxlength="10000" required></textarea><div class="actions"><button type="button" class="secondary" id="cancel-save" data-text="cancel"></button><button type="submit" class="primary" data-text="save"></button></div></form></section>
<section id="support-panel" hidden><button class="link back" type="button" data-back>← <span data-text="back">Back</span></button><div class="support-emblem" aria-hidden="true">♡</div><p class="eyebrow" data-text="supportKicker"></p><h1 data-text="supportHeading"></h1><p class="support-copy" data-text="supportBody"></p><p class="support-price"><span data-text="supportFrom"></span><strong>US$ 1</strong></p><div class="support-suggestions" aria-label="USD"><span>US$ 1</span><span>US$ 3</span><span>US$ 5</span><span>US$ 10</span></div><p class="note" data-text="supportAmounts"></p><button id="sponsor-button" class="primary full" type="button" disabled data-text="supportContinue"></button><p id="support-pending" class="support-pending" role="status" data-text="supportPending"></p><p class="note" data-text="supportCheckout"></p><a class="key-link" href="https://github.com/klederson/tabhero" target="_blank" rel="noopener noreferrer" data-text="supportStar"></a></section><p id="status" role="status" aria-live="polite"></p></main></body></html>
