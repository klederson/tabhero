<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>JáTá — abrindo a conversa</title>
    <link rel="stylesheet" href="handoff.css">
    <script type="module" src="handoff.js"></script>
  </head>
  <body>
    <main>
      <img class="symbol" src="icons/128.png" width="56" height="56" alt="JáTá">
      <h1>Uma conversa nova.<br>A aba de sempre.</h1>
      <p id="status" role="status" aria-live="polite">Abrindo a conversa no WhatsApp Web…</p>
      <button id="retry" type="button" hidden>Tentar novamente</button>
      <a href="https://web.whatsapp.com/">Abrir o WhatsApp Web</a>
    </main>
  </body>
</html>
