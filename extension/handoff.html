<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>TabThere — opening your conversation</title>
    <link rel="stylesheet" href="handoff.css">
    <script type="module" src="handoff.js"></script>
  </head>
  <body>
    <main>
      <img class="symbol" src="icons/128.png" width="56" height="56" alt="TabThere">
      <h1><span data-i18n="headlineFirst">New chat.</span><br><span data-i18n="headlineSecond">Same tab.</span></h1>
      <p id="status" role="status" aria-live="polite" data-i18n="opening">Opening the conversation in WhatsApp Web…</p>
      <button id="retry" type="button" data-i18n="retry" hidden>Try again</button>
      <a href="https://web.whatsapp.com/" data-i18n="openWhatsApp">Open WhatsApp Web</a>
    </main>
  </body>
</html>
