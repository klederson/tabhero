<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>TabHero — Social Card</title>
  <style>
    @font-face{font-family:Bricolage;src:url('../website/assets/fonts/bricolage-grotesque.ttf') format('truetype');font-weight:200 800}
    @font-face{font-family:Manrope;src:url('../website/assets/fonts/manrope.ttf') format('truetype');font-weight:400 800}
    *{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden;background:#F7F7EF;color:#17231B;font-family:Manrope,sans-serif}main{position:relative;width:1200px;height:630px;padding:43px 55px 37px;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between}.logo{width:161px;height:auto}.tag{border:1px solid #b3bea7;border-radius:5px;padding:8px 11px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.copy{position:relative;z-index:2;margin-top:44px}h1{font:800 86px/.97 Bricolage,sans-serif;letter-spacing:-.06em;margin:0;max-width:810px}.marker{position:relative;display:inline-block;isolation:isolate}.marker:before{content:'';position:absolute;z-index:-1;inset:17px -13px -3px -6px;background:#C7F65A;transform:rotate(-1.7deg)}.slogan{font-size:21px;font-weight:650;letter-spacing:-.025em;margin:26px 0 0}.tile{position:absolute;width:244px;height:244px;right:49px;top:225px;transform:rotate(8deg);border-radius:66px;border:2px solid #17231B;background:#C7F65A;box-shadow:12px 13px 0 #17231B}.tile img{width:100%;height:100%}.caption{position:absolute;right:56px;top:510px;font-size:11px;font-weight:700;transform:rotate(3deg)}footer{position:absolute;left:55px;right:55px;bottom:31px;border-top:1px solid #d6ddcc;display:flex;justify-content:space-between;align-items:center;padding-top:18px;font-size:11px;line-height:1.5}.repo{font-weight:800;letter-spacing:.015em}.support{font-size:10px;color:#536148}.dot{display:inline-block;width:7px;height:7px;background:#FF795A;border-radius:50%;margin-right:8px}
  </style>
</head>
<body>
  <main aria-label="TabHero: Another tab? It’s already open. New chat. Same tab.">
    <div class="top"><img class="logo" src="logo.svg" alt="tabhero."><span class="tag">Experimental · MIT · v1.4.0</span></div>
    <div class="copy"><h1>Another tab?<br>It’s already<br><span class="marker">open.</span></h1><p class="slogan">New chat. Same tab.</p></div>
    <div class="tile"><img src="../website/assets/symbol.svg" alt="Symbol: an arrow returning inside the tab"></div>
    <p class="caption">tab. here. hero. ↩</p>
    <footer><span class="repo"><span class="dot"></span>github.com/klederson/tabhero</span><span class="support">Optional US$ 1 support · coming soon</span><span>Independent. Not affiliated with WhatsApp or Meta.</span></footer>
  </main>
</body>
</html>
